---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "opensearch-operator.labels" . | nindent 4 }}
  name: {{ include "opensearch-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: https
    port: 8443
    targetPort: https
  - name: health
    port: 8081
    targetPort: health
  selector:
    {{- include "opensearch-operator.selectorLabels" . | nindent 4 }}
