{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "opensearch-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opensearch-operator.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "opensearch-operator.selectorLabels" . | nindent 6 }}
  endpoints:
  - path: /metrics
    port: https
    scheme: https
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      {{- if gt (len .Values.serviceMonitor.tlsConfig) 0 }}
      {{- toYaml .Values.serviceMonitor.tlsConfig | nindent 6 }}
      {{- else }}
      insecureSkipVerify: true
      {{- end }}
    {{- with .Values.serviceMonitor.interval }}
    interval: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceMonitor.scrapeTimeout }}
    scrapeTimeout: {{ . | quote }}
    {{- end }}
{{- end }}
