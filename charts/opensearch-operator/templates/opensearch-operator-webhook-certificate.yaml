{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
{{- /*
Fail when this render is against a cluster without cert-manager. lookup is empty
with no cluster, so helm template and helm lint skip the fail.

The lookups are nested so they are skipped when cert-manager.io/v1 is present.
Helm's sprig and would still evaluate lookup, and a Forbidden error from it
aborts the release.

The default ServiceAccount is in the release namespace, so a namespace-scoped
installer can read it. helm install --create-namespace renders before that
namespace exists and that lookup is empty; kube-system is only read then.
*/}}
{{- if not (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
{{- $connected := lookup "v1" "ServiceAccount" .Release.Namespace "default" }}
{{- if not $connected }}
{{- $connected = lookup "v1" "Namespace" "" "kube-system" }}
{{- end }}
{{- if $connected }}
{{- $tlsSecret := .Values.webhook.secretName | default (printf "%s-webhook-server-cert" (include "opensearch-operator.fullname" .)) }}
{{- fail (printf "cert-manager is required (webhook.certManager.enabled=true) but cert-manager.io/v1 was not found in the cluster. Install cert-manager first, or set webhook.certManager.enabled=false and create TLS secret %s, or set webhook.enabled=false." $tlsSecret) }}
{{- end }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "opensearch-operator.fullname" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "opensearch-operator.fullname" . }}-serving-cert
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
  - {{ include "opensearch-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
  - {{ include "opensearch-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "opensearch-operator.fullname" . }}-selfsigned-issuer
  secretName: {{ include "opensearch-operator.fullname" . }}-webhook-server-cert
{{- end }}

