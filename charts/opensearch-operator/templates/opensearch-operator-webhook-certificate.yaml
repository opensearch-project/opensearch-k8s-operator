{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
{{- /* lookup is empty without a live cluster, so helm template and lint skip this check. */}}
{{- if and (lookup "v1" "Namespace" "" "kube-system") (not (.Capabilities.APIVersions.Has "cert-manager.io/v1")) }}
{{- fail "cert-manager is required (webhook.certManager.enabled=true) but cert-manager.io/v1 was not found in the cluster. Install cert-manager first, or set webhook.certManager.enabled=false and provide webhook.secretName, or set webhook.enabled=false." }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "opensearch-operator.fullname" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "opensearch-operator.fullname" . }}-serving-cert
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
  - {{ include "opensearch-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
  - {{ include "opensearch-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "opensearch-operator.fullname" . }}-selfsigned-issuer
  secretName: {{ include "opensearch-operator.fullname" . }}-webhook-server-cert
{{- end }}

