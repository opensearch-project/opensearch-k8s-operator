name: "Publish Release from tag"

on:
  push:
    tags:
      - 'opensearch-operator-*'
      - 'opensearch-cluster-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    if: github.repository == 'opensearch-project/opensearch-k8s-operator'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Resolve chart from tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            opensearch-operator-*) CHART="opensearch-operator" ;;
            opensearch-cluster-*) CHART="opensearch-cluster" ;;
            *)
              echo "::error::Tag '$TAG' does not match a known chart prefix"
              exit 1
              ;;
          esac
          TAG_VERSION="${TAG#${CHART}-}"
          CHART_VERSION="$(helm show chart "charts/${CHART}" | awk '/^version:/ {print $2}')"
          if [ "$TAG_VERSION" != "$CHART_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match ${CHART} Chart.yaml version '$CHART_VERSION'"
            exit 1
          fi
          DESCRIPTION="$(helm show chart "charts/${CHART}" | awk -F': ' '/^description:/ {print $2}')"
          echo "chart=$CHART" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          helm package "charts/${{ steps.meta.outputs.chart }}" -d .cr-release-packages/

      - name: Create GitHub pre-release with chart asset
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: .cr-release-packages/${{ github.ref_name }}.tgz
          body: ${{ steps.meta.outputs.description }}
          prerelease: true
          immutableCreate: true

      - name: Update index.yaml and open PR to gh-pages
        env:
          GH_TOKEN: ${{ secrets.OPENSEARCH_CI_BOT_TOKEN }}
          TZ: UTC
          TAG: ${{ github.ref_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          BRANCH="update-index-${TAG}"

          git config user.name "opensearch-ci-bot"
          git config user.email "opensearch-infra@amazon.com"

          git fetch origin gh-pages
          git checkout -b "$BRANCH" origin/gh-pages

          mkdir -p .tmp-index
          cp ".cr-release-packages/${TAG}.tgz" .tmp-index/
          helm repo index .tmp-index \
            --url "https://github.com/${{ github.repository }}/releases/download/${TAG}" \
            --merge index.yaml
          cp .tmp-index/index.yaml index.yaml
          rm -rf .tmp-index

          git add index.yaml
          git commit --signoff -m "Update index.yaml for ${TAG}"

          git remote add fork "https://github.com/opensearch-ci-bot/${REPO_NAME}.git"
          gh auth setup-git
          git push --force fork "$BRANCH"

          gh pr create \
            --repo "${{ github.repository }}" \
            --base gh-pages \
            --head "opensearch-ci-bot:${BRANCH}" \
            --title "[AUTO] Update index.yaml for ${TAG}" \
            --body "Update index.yaml on gh-pages for ${TAG}."
