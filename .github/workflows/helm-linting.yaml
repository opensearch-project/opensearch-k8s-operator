name: Helm Lint

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs: 
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure chart versions are unchanged outside release PRs
        if: steps.list-changed.outputs.changed == 'true' && !startsWith(github.event.pull_request.title, 'release:')
        run: |
          failed=0
          base="origin/${{ github.event.repository.default_branch }}"

          for chart in charts/*/Chart.yaml; do
            if ! git cat-file -e "$base:$chart" 2>/dev/null; then
              continue
            fi

            base_version=$(git show "$base:$chart" | awk -F': *' '$1 == "version" { print $2; exit }')
            pr_version=$(awk -F': *' '$1 == "version" { print $2; exit }' "$chart")

            if [[ "$base_version" != "$pr_version" ]]; then
              echo "::error file=$chart::Regular PRs must not change Chart.yaml version; chart versions are bumped only in release-cut PRs."
              echo "$chart: $base_version -> $pr_version"
              failed=1
            fi
          done

          exit "$failed"

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --validate-maintainers=false --check-version-increment=false
