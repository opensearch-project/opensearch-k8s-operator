name: Prepare Helm chart release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-release-main
  cancel-in-progress: false

jobs:
  release-pr:
    if: >-
      github.repository == 'opensearch-project/opensearch-k8s-operator' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_CHART_RELEASE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Prepare release PR
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.OPENSEARCH_CI_BOT_TOKEN }}
          fork: true
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Verify release PR identity
        id: head
        env:
          GH_TOKEN: ${{ secrets.OPENSEARCH_CI_BOT_TOKEN }}
        run: |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base=main \
            -f head=opensearch-ci-bot:release-please--branches--main \
            --jq '.[0] // empty' > "$RUNNER_TEMP/chart-release-pr.json"
          if [[ ! -s "$RUNNER_TEMP/chart-release-pr.json" ]]; then
            exit 0
          fi
          python3 scripts/chart_release.py release-head --pr "$RUNNER_TEMP/chart-release-pr.json"

      - name: Install documentation generator from trusted main
        if: steps.head.outputs.sha != ''
        run: make -C opensearch-operator helm-docs

      - name: Check out verified release PR
        if: steps.head.outputs.sha != ''
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ steps.head.outputs.repository }}
          ref: ${{ steps.head.outputs.sha }}
          path: release-pr
          persist-credentials: false

      - name: Update generated chart documentation
        if: steps.head.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.OPENSEARCH_CI_BOT_TOKEN }}
          RELEASE_BRANCH: ${{ steps.head.outputs.branch }}
        run: |
          opensearch-operator/bin/helm-docs -s file -c release-pr/charts/opensearch-operator
          opensearch-operator/bin/helm-docs -s file -c release-pr/charts/opensearch-cluster
          cd release-pr
          git add charts/opensearch-operator/README.md charts/opensearch-cluster/README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "opensearch-ci-bot"
          git config user.email "opensearch-infra@amazon.com"
          git commit --signoff -m "docs: regenerate Helm chart documentation"
          gh auth setup-git
          git push origin "HEAD:${RELEASE_BRANCH}"
