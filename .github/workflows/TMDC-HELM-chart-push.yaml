name: TMDC Helm chart push workflow to AWS ECR

on:
  push:
    tags:
      - 'operator-*[0-9]+.*[0-9]+.*[0-9]-d*'
      - 'cluster-*[0-9]+.*[0-9]+.*[0-9]-d*'

jobs:
  push-operator-chart:
    name: Push opensearch-operator chart to ECR
    runs-on: ubuntu-latest
    container:
        image: rubiklabs/k8s_cli_builder:0.6.0
        credentials:
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    permissions:
      id-token: write
      contents: read

    if: startsWith(github.ref, 'refs/tags/operator-')
    steps:
    - name: Check out the repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_ECR_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Configure Git safe directory
      run: git config --global --add safe.directory /__w/cert-manager/cert-manager

    - name: Install rsync
      run: apt-get update && apt-get install -y rsync

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#operator-}" >> $GITHUB_OUTPUT

    - name: Package and push opensearch-operator chart
      env:
        TAG: ${{ steps.version.outputs.VERSION }}
        ECR_HOST: ${{ steps.login-ecr.outputs.registry }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_ECR_REGION }}
      run: |
          make push-oci-chart DIR=opensearch-operator

  push-cluster-chart:
    name: Push opensearch-cluster chart to ECR
    runs-on: ubuntu-latest
    container:
        image: rubiklabs/k8s_cli_builder:0.6.0
        credentials:
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    permissions:
      id-token: write
      contents: read

    if: startsWith(github.ref, 'refs/tags/cluster-')
    steps:
    - name: Check out the repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_ECR_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Configure Git safe directory
      run: git config --global --add safe.directory /__w/cert-manager/cert-manager

    - name: Install rsync
      run: apt-get update && apt-get install -y rsync

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#cluster-}" >> $GITHUB_OUTPUT

    - name: Package and push opensearch-cluster chart
      env:
        TAG: ${{ steps.version.outputs.VERSION }}
        ECR_HOST: ${{ steps.login-ecr.outputs.registry }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_ECR_REGION }}
      run: |
          make push-oci-chart DIR=opensearch-cluster