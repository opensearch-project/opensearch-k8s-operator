# OpenSearch 3.x cluster with a dedicated warm pool, backed by SeaweedFS as the S3 repository.
apiVersion: v1
kind: Secret
metadata:
  name: searchable-snapshots-s3
  namespace: default
type: Opaque
stringData:
  s3.client.default.access_key: s3admin
  s3.client.default.secret_key: s3admin-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchable-snapshots-seaweedfs
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchable-snapshots-seaweedfs
  template:
    metadata:
      labels:
        app: searchable-snapshots-seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: docker.io/chrislusf/seaweedfs:4.48
          args:
            - mini
            - -bucket=snapshots
            - -webdav=false
            - -admin.ui=false
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -master.telemetry=false
          env:
            - name: AWS_ACCESS_KEY_ID
              value: s3admin
            - name: AWS_SECRET_ACCESS_KEY
              value: s3admin-secret
          ports:
            - containerPort: 8333
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8333
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searchable-snapshots-seaweedfs
  namespace: default
spec:
  selector:
    app: searchable-snapshots-seaweedfs
  ports:
    - port: 8333
      targetPort: 8333
---
apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: searchable-snapshots
  namespace: default
spec:
  general:
    version: 3.4.0
    vendor: Opensearch
    serviceName: searchable-snapshots
    httpPort: 9200
    setVMMaxMapCount: true
    pluginsList: ["repository-s3"]
    keystore:
      - secret:
          name: searchable-snapshots-s3
    snapshotRepositories:
      - name: snapshots
        type: s3
        settings:
          bucket: snapshots
          base_path: searchable-snapshots
    additionalConfig:
      # Lower thresholds to avoid tests failing on
      # resource-constrained environments like Github Action runners
      cluster.routing.allocation.disk.watermark.low: 500m
      cluster.routing.allocation.disk.watermark.high: 300m
      cluster.routing.allocation.disk.watermark.flood_stage: 100m
      s3.client.default.endpoint: searchable-snapshots-seaweedfs.default.svc:8333
      s3.client.default.protocol: http
      s3.client.default.path_style_access: "true"
      s3.client.default.region: us-east-1
  dashboards:
    enable: false
  initHelper:
    image: docker.io/busybox:1.36
    imagePullPolicy: IfNotPresent
    version: "1.36"
  nodePools:
    - component: hot
      replicas: 1
      diskSize: 1Gi
      resources:
        limits:
          cpu: 500m
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 2Gi
      roles:
        - cluster_manager
        - data
        - ingest
    - component: warm
      replicas: 1
      diskSize: 1Gi
      resources:
        limits:
          cpu: 500m
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 2Gi
      roles:
        - warm
      additionalConfig:
        # local-path volumes report the host disk size, so the 80% default would be huge. With the
        # absolute watermarks above, the warm disk decider needs cache x remote_data_ratio (5) to
        # stay well above 500m x 5, or it refuses remote shards once file cache stats arrive.
        node.search.cache.size: 2gb
  security:
    tls:
      http:
        generate: true
      transport:
        generate: true
        perNode: true
